name: 3-Hour Global News Map Auto Update

on:
  schedule:
    # 3시간마다 실행 (0:00, 3:00, 6:00, 9:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # GitHub Actions 탭에서 수동 'Run workflow' 즉시 실행 가능

permissions:
  contents: write

jobs:
  update-news-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Latest Global News (Crawl RSS & Update Dataset)
        run: node update_news.js

      - name: Rebuild Standalone Map (index.html)
        run: node build_map.js

      - name: Commit and Push Updated Data & Map
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add integrated_issues.json last_updated.json index.html
          git diff --staged --quiet || (git commit -m "chore: 3시간 주기 글로벌 뉴스 & 지도 자동 갱신 [$(date -u '+%Y-%m-%d %H:%M:%S UTC')]" && git push)
