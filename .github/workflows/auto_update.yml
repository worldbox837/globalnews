name: 3-Hour Global News Map Auto Update

on:
  schedule:
    # 3시간마다 실행 (0, 3, 6, 9, 12, 15, 18, 21 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # 수동 즉시 실행 가능

permissions:
  contents: write

jobs:
  update-news-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Latest Global News
        run: node update_news.js

      - name: Rebuild Standalone Map
        run: node build_map.js

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add integrated_issues.json last_updated.json index.html
          git diff --staged --quiet || (git commit -m "chore: 3시간 주기 글로벌 뉴스 & 지도 자동 갱신" && git push)
